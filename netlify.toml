[build]
  command = "NITRO_PRESET=netlify npm run build"
  publish = ".output/public"

[functions]
  node_bundler = "esbuild"
  directory = ".netlify/functions"

# Catch-all redirect for client-side routing
# Rewrites all requests to index.html with 200 status (preserves URL in browser)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
